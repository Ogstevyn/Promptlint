<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 480" width="1380" height="480">
  <rect width="1380" height="480" fill="#08090b"/>
  <g transform="translate(96 80) scale(0.625)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1f25"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.38" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#10b981" stroke-opacity="0.28" stroke-width="6"/>
  <!-- prompt chevron -->
  <path d="M132 160 L244 256 L132 352" fill="none" stroke="url(#mark)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the cursor is a lint squiggle -->
  <path d="M274 342 q 16 -26 32 0 t 32 0 t 32 0 t 32 0" fill="none" stroke="#fbbf24" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="460" y="282" font-family="SF Pro Display, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="150" font-weight="700" letter-spacing="-4" fill="#e7eaee">Prompt<tspan fill="#34d399">Lint</tspan></text>
  <text x="466" y="356" font-family="SF Pro Text, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="500" fill="#9aa2ae">Lint, harden and cost your LLM calls · via Otari</text>
</svg>

name: "PromptLint — Mozilla Otari LLM Linter & PR Cost Report"
description: "Scans a repository for LLM prompts, flags cost/latency/injection smells, suggests rewrites, and calculates Mozilla Otari Gateway savings per PR."
author: "ogstevyn"
branding:
  icon: "zap"
  color: "purple"

inputs:
  target-path:
    description: "Directory or file path to scan for LLM prompts"
    required: false
    default: "."
  monthly-volume:
    description: "Assumed monthly call volume per endpoint for cost projections"
    required: false
    default: "100000"
  otari-api-key:
    description: "Mozilla Otari Gateway API Key (Otari-Key)"
    required: false
  otari-base-url:
    description: "Mozilla Otari Gateway Base URL"
    required: false
    default: "https://api.otari.ai/api/v1"
  post-pr-comment:
    description: "Automatically post the Markdown cost & security report on the Pull Request"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install & Build PromptLint
      shell: bash
      # Build the action's own sources, not the calling repository
      working-directory: ${{ github.action_path }}
      run: |
        npm ci
        npm run build

    - name: Run PromptLint Scan & Generate Mozilla Otari PR Cost Report
      shell: bash
      env:
        OTARI_API_KEY: ${{ inputs.otari-api-key }}
        OTARI_BASE_URL: ${{ inputs.otari-base-url }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        PROMPTLINT_CLI: ${{ github.action_path }}/packages/cli/dist/cli.js
        PROMPTLINT_TARGET: ${{ github.workspace }}/${{ inputs.target-path }}
        PROMPTLINT_REPORT: ${{ github.workspace }}/promptlint-report.md
        PROMPTLINT_POST_PR: ${{ inputs.post-pr-comment }}
        PROMPTLINT_VOLUME: ${{ inputs.monthly-volume }}
      run: |
        POST_FLAG=""
        if [ "$PROMPTLINT_POST_PR" = "true" ]; then
          POST_FLAG="--post-pr"
        fi
        node "$PROMPTLINT_CLI" ci-report "$PROMPTLINT_TARGET" --output "$PROMPTLINT_REPORT" --volume "$PROMPTLINT_VOLUME" $POST_FLAG
        if [ -n "$GITHUB_STEP_SUMMARY" ]; then
          cat "$PROMPTLINT_REPORT" >> "$GITHUB_STEP_SUMMARY"
        fi
